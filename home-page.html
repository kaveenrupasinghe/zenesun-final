<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>

    <!-- Favicons -->
    <link href="img/logo.png" rel="icon">
    <link href="img/apple-touch-icon.png" rel="apple-touch-icon">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Main CSS File -->
    <link rel="stylesheet" href="home-page.css">

</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container d-flex justify-content-center">
            <a class="navbar-brand" href="home-page.html">
                <h1><img src="/img/logo.png" alt="Logo" width="70" height="70" class="align-text-top"></h1>
            </a>
        </div>
    </nav>

    <!-- Slideshow -->
    <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="/img/DSC_0208.JPG" class="d-block w-100" alt="slide 1">
                <div class="carousel-caption">
                    <h1>Welcome to Zenesun Group</h1>
                </div>
            </div>
            <div class="carousel-item">
                <img src="/img/DSC_0066.JPG" class="d-block w-100" alt="slide 2">
                <div class="carousel-caption">
                    <h2>2nd slide label</h2>
                </div>
            </div>
            <div class="carousel-item">
                <img src="/img/slide3.jpg" class="d-block w-100" alt="slide 3">
                <div class="carousel-caption">
                    <h2>First slide label</h2>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- Company Section -->
    <section id="company" class="company-section">
        <div class="container section-title text-center">
          <h2>ゼネサングループ</h2>
        </div>
        <br>
        <div class="container text-center">
            <div class="row gy-4">
                <div class="col-lg-4 col-md-6">
                    <div class="company">
                        <h3>株式会社ゼネサン</h3>
                        <img src="/img/logo.png" class="card-img-top" alt="Zenesun logo">
                        <a href="zenesun.html" target="_blank" class="btn btn-primary">See more</a>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="company">
                        <h3>株式会社ゼネサン化成</h3>
                        <img src="/img/logo.png" class="card-img-top" alt="Zenesun logo">
                        <a href="#" target="_blank" class="btn btn-primary">See more</a>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="company">
                        <h3>株式会社技研</h3>
                        <img src="/img/logo.png" class="card-img-top" alt="Zenesun logo">
                        <a href="#" target="_blank" class="btn btn-primary">See more</a>
                    </div>
                </div>
            </div>
        </div>
    </section><!-- /Services Section -->

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Zenesun. All Rights Reserved.</p>
    </footer>

    <button id="backToTop" title="Go to top">↑</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
