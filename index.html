<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゼネサングループ</title>

    <!-- Favicons -->
    <link href="img/logo.png" rel="icon">
    <link href="img/apple-touch-icon.png" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Left-aligned Logo -->
            <a class="navbar-brand" href="home-page.html">
                <img src="/img/logo.png" alt="Logo" width="50" height="50">
            </a>
            <!-- Centered Brand Name -->
            <span class="navbar-text fw-bold text-white">ゼネサングループ</span>
        </div>
    </nav>

    <!-- Slideshow -->
    <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="3"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="4"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="5"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="6"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="7"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="/img/slide 1.png" class="d-block w-100" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="/img/slide 2.png" class="d-block w-100" alt="Slide 2">
            </div>
            <div class="carousel-item">
                <img src="/img/slide 3.png" class="d-block w-100" alt="Slide 3">
            </div>
            <div class="carousel-item">
                <img src="/img/slide 4.JPG" class="d-block w-100" alt="Slide 4">
            </div>
            <div class="carousel-item">
                <img src="/img/slide 5.JPG" class="d-block w-100" alt="Slide 5">
            </div>
            <div class="carousel-item">
                <img src="/img/slide 6.JPG" class="d-block w-100" alt="Slide 6">
            </div>
            <div class="carousel-item">
                <img src="/img/slide 7.JPG" class="d-block w-100" alt="Slide 7">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- Company Section -->
    <section id="company" class="company-section">
        <div class="container">
            <div class="section-title text-center mb-5">
                <h2 class="fw-bold">ゼネサングループ</h2>
            </div>

            <div class="row gy-4 justify-content-center">
                <div class="col-lg-4 col-md-6">
                    <div class="company-card text-center">
                        <img src="/img/logo.png" class="company-logo" alt="Zenesun Logo">
                        <h3>株式会社ゼネサン金型</h3>
                        <a href="zenesun.html" target="_blank" class="btn btn-primary">詳しくはこちら</a>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="company-card text-center">
                        <img src="/img/logo.png" class="company-logo" alt="Zenesun Logo">
                        <h3>株式会社ゼネサン化成</h3>
                        <a href="chemical.html" target="_blank" class="btn btn-primary">詳しくはこちら</a>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="company-card text-center">
                        <img src="/img/logo.png" class="company-logo" alt="Zenesun Logo">
                        <h3>株式会社技研</h3>
                        <a href="#" target="_blank" class="btn btn-primary">詳しくはこちら</a>
                    </div>
                </div>
            </div>
        </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Zenesun. All Rights Reserved.</p>
    </footer>

    <button id="backToTop" title="Go to top">↑</button>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
